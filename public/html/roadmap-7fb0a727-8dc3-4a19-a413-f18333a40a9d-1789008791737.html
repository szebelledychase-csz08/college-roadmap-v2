<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College & Career Roadmap - Sarah Chen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1a1a1a;
            background: white;
            line-height: 1.6;
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            border-bottom: 3px solid #000;
            padding-bottom: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #000;
        }

        header p {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 0.25rem;
        }

        .student-info {
            background: #f5f5f5;
            border-left: 4px solid #000;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-radius: 4px;
        }

        .student-info p {
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        h2 {
            font-size: 1.8rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #333;
            padding-bottom: 0.5rem;
            color: #000;
        }

        h3 {
            font-size: 1.3rem;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: #333;
        }

        ul, ol {
            margin-left: 2rem;
            margin-bottom: 1rem;
        }

        li {
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        p {
            margin-bottom: 1rem;
            color: #1a1a1a;
        }

        .section {
            margin-bottom: 2rem;
            page-break-inside: avoid;
        }

        .highlight {
            background: #f0f0f0;
            padding: 1rem;
            border-left: 4px solid #666;
            border-radius: 4px;
            margin: 1rem 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            background: white;
        }

        th {
            background: #333;
            color: white;
            padding: 0.75rem;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        .milestone {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 1rem;
            margin: 0.75rem 0;
            border-radius: 4px;
        }

        .milestone strong {
            color: #000;
        }

        footer {
            border-top: 2px solid #000;
            margin-top: 3rem;
            padding-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }

        @media print {
            body {
                padding: 0;
            }
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🎓 College & Career Roadmap</h1>
        <p><strong>Sarah Chen</strong></p>
        <p>Generated: 9/9/2026</p>

        <p><strong>University:</strong> MIT</p>
        <p><strong>Major:</strong> Computer Science + Mathematics</p>

    </div>

    <div class="section">
        undefined
    </div>

    <footer>
        <p>This personalized roadmap was generated by College Roadmap Generator V2</p>

    </footer>
</body>
</html>
